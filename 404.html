<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOOD — Page introuvable</title>
  <style>
    :root { color-scheme: dark; --ink: #eef0e7; --muted: #b8c0b2; --bg: #07100b; --panel: #14261c; --line: #4a654d; --accent: #c8ff86; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #284b35, var(--bg) 58%); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 680px); border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: clamp(28px, 7vw, 72px); }
    .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .24em; font-weight: 700; }
    h1 { margin: 20px 0 12px; font-size: clamp(42px, 11vw, 92px); line-height: .9; letter-spacing: -.05em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 18px; line-height: 1.6; }
    a { display: inline-block; margin-top: 20px; padding: 16px 22px; color: #102016; background: var(--accent); text-decoration: none; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    @media (max-width: 400px) {
      main { padding: 26px 20px; }
      h1 { font-size: clamp(38px, 13vw, 54px); overflow-wrap: anywhere; }
      p { font-size: 16px; }
      a { max-width: 100%; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">WOOD / NICE</div>
    <h1>PAGE <span>INTROUVABLE.</span></h1>
    <p>Cette adresse n’existe pas ou a été déplacée. Retourne à l’univers WOOD pour continuer.</p>
    <a href="/">Retour à WOOD ↗</a>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title>Symbole original WOOD</title>
  <g fill="#f1f0e6">
    <!-- The original mark has seven outward branches; there is no branch pointing down. -->
    <rect x="43.5" y="6" width="13" height="44"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(45 50 50)"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(90 50 50)"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(135 50 50)"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(225 50 50)"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(270 50 50)"/>
    <rect x="43.5" y="6" width="13" height="44" transform="rotate(315 50 50)"/>
    <circle cx="50" cy="91" r="7"/>
  </g>
</svg>
